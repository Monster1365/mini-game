<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오목</title>
<script src="../_shared/theme.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #1b1a17;
    --panel: #2a2722;
    --line: #4a443a;
    --text: #f3ede2;
    --muted: #b3a994;
    --accent: #e8b04a;
    --win: #e5484d;
    --board-shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f7f2e8;
    --panel: #ffffff;
    --line: #ddd3c1;
    --text: #2b2418;
    --muted: #7a6d57;
    --accent: #b8790d;
    --win: #d12f3a;
    --board-shadow: 0 10px 28px rgba(90,60,20,.22);
  }
  :root[data-theme="light"] .player.white .dot { box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    gap: 12px;
    user-select: none;
    -webkit-user-select: none;
  }
  .top {
    width: 100%;
    max-width: 640px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .players { display: flex; gap: 8px; }
  .player {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border: 2px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
    transition: border-color .15s, transform .15s;
  }
  .player.active { border-color: var(--accent); transform: scale(1.04); }
  .player .dot { width: 18px; height: 18px; border-radius: 50%; }
  .player.black .dot { background: radial-gradient(circle at 35% 35%, #666, #000 60%); }
  .player.white .dot { background: radial-gradient(circle at 35% 35%, #fff, #cfcfcf 70%); }
  .player .name { font-weight: 700; }
  .player .score { color: var(--muted); font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 8px; }
  button {
    font: inherit;
    font-size: .9rem;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  #status { min-height: 1.5em; margin: 0; font-weight: 600; color: var(--muted); text-align: center; }
  #status.win { color: var(--accent); font-size: 1.15rem; }
  .board-wrap { flex: 1; min-height: 0; width: 100%; display: flex; align-items: flex-start; justify-content: center; }
  canvas { display: block; border-radius: 6px; box-shadow: var(--board-shadow); cursor: pointer; touch-action: manipulation; }
  canvas.over { cursor: default; }
  canvas.blocked { cursor: not-allowed; }
  #status.warn { color: var(--win); }
  .rules { margin: 0; color: var(--muted); font-size: .8rem; text-align: center; }
  .rules b { color: var(--text); }
</style>
</head>
<body>
  <div class="top">
    <div class="players">
      <div class="player black" id="pBlack"><span class="dot"></span><span class="name">흑</span><span class="score" id="sBlack">0승</span></div>
      <div class="player white" id="pWhite"><span class="dot"></span><span class="name">백</span><span class="score" id="sWhite">0승</span></div>
    </div>
    <div class="actions">
      <button id="undoBtn" type="button">↶ 무르기</button>
      <button id="newBtn" type="button">↻ 새 게임</button>
    </div>
  </div>
  <p id="status" aria-live="polite"></p>
  <p class="rules"><b>렌주룰</b> · 흑은 3·3, 4·4, 6목 이상(장목) 금지 <span aria-hidden="true">(✕ 표시)</span> · 흑은 정확히 5목, 백은 5목 이상이면 승리</p>
  <div class="board-wrap" id="wrap"><canvas id="board" aria-label="오목판"></canvas></div>

<script>
(() => {
  const N = 15;                 // 15×15 판
  const EMPTY = 0, BLACK = 1, WHITE = 2;
  const NAME = { [BLACK]: '흑', [WHITE]: '백' };
  const STARS = [3, 7, 11];

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('wrap');
  const statusEl = document.getElementById('status');
  const undoBtn = document.getElementById('undoBtn');

  let board, turn, history, winLine, over, hover = null;
  let forbidden = new Map();   // 흑 차례의 금수 자리 "r,c" → 이유
  let flash = null, flashTimer = 0;
  const score = { [BLACK]: 0, [WHITE]: 0 };
  let size = 0, cell = 0;

  function reset() {
    board = Array.from({ length: N }, () => new Array(N).fill(EMPTY));
    turn = BLACK;
    history = [];
    winLine = null;
    over = false;
    update();
  }

  const DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];
  const inside = (r, c) => r >= 0 && r < N && c >= 0 && c < N;

  // (r,c)를 지나는 한 방향의 연속된 같은 색 돌 좌표
  function runThrough(r, c, dr, dc) {
    const color = board[r][c];
    const line = [[r, c]];
    for (const s of [1, -1]) {
      let rr = r + dr * s, cc = c + dc * s;
      while (inside(rr, cc) && board[rr][cc] === color) {
        line.push([rr, cc]);
        rr += dr * s; cc += dc * s;
      }
    }
    return line;
  }

  // ---------- 승리 판정 (흑: 정확히 5목, 백: 5목 이상) ----------
  function findWin(r, c) {
    const color = board[r][c];
    for (const [dr, dc] of DIRS) {
      const line = runThrough(r, c, dr, dc);
      if (color === BLACK ? line.length === 5 : line.length >= 5) return line;
    }
    return null;
  }

  // ---------- 렌주룰 금수 판정 (흑만 해당) ----------
  // 흑돌이 (r,c)에 놓여 있다고 가정하고, 한 방향에서 (r,c)를 포함하는 '4'들을 찾는다.
  // 4 = 한 수만 더 두면 정확히 5목이 되는 돌 4개. 반환값: "돌 4개" 키 → 5목을 완성하는 빈 자리 수
  // (열린 4는 같은 돌 4개를 양쪽 두 자리에서 완성할 수 있으므로 값이 2)
  function fourGroups(r, c, dr, dc) {
    const groups = new Map();
    for (let k = -4; k <= 4; k++) {
      const qr = r + dr * k, qc = c + dc * k;
      if (k === 0 || !inside(qr, qc) || board[qr][qc] !== EMPTY) continue;
      board[qr][qc] = BLACK;
      const line = runThrough(qr, qc, dr, dc);
      board[qr][qc] = EMPTY;
      if (line.length !== 5 || !line.some(([a, b]) => a === r && b === c)) continue;
      const key = line.filter(([a, b]) => a !== qr || b !== qc).map(p => p.join(',')).sort().join(';');
      groups.set(key, (groups.get(key) || 0) + 1);
    }
    return groups;
  }

  // 열린 3 = 한 수 더 두어 열린 4를 만들 수 있고, 그 자리가 금수가 아닌 3
  function isOpenThree(r, c, dr, dc, depth) {
    for (let k = -4; k <= 4; k++) {
      const qr = r + dr * k, qc = c + dc * k;
      if (k === 0 || !inside(qr, qc) || board[qr][qc] !== EMPTY) continue;
      board[qr][qc] = BLACK;
      const straightFour = [...fourGroups(r, c, dr, dc).values()].some(n => n === 2);
      board[qr][qc] = EMPTY;
      if (straightFour && !forbiddenReason(qr, qc, depth + 1)) return true;
    }
    return false;
  }

  // 흑이 (r,c)에 두면 금수인지 판정. 금수면 이유 문자열, 아니면 null
  function forbiddenReason(r, c, depth = 0) {
    if (board[r][c] !== EMPTY) return null;
    board[r][c] = BLACK;
    let reason = null;
    const runs = DIRS.map(([dr, dc]) => runThrough(r, c, dr, dc).length);
    if (!runs.includes(5)) {                       // 5목이 되면 다른 조건과 상관없이 승리
      if (runs.some(n => n > 5)) {
        reason = '장목';
      } else {
        let fours = 0, threes = 0;
        for (const [dr, dc] of DIRS) {
          const groups = fourGroups(r, c, dr, dc);
          if (groups.size) fours += groups.size;   // 한 줄에 4가 둘이면 그것도 4·4
          else if (depth < 3 && isOpenThree(r, c, dr, dc, depth)) threes++;
        }
        if (fours >= 2) reason = '4·4';
        else if (threes >= 2) reason = '3·3';
      }
    }
    board[r][c] = EMPTY;
    return reason;
  }

  function computeForbidden() {
    forbidden = new Map();
    if (over || turn !== BLACK) return;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const reason = forbiddenReason(r, c);
      if (reason) forbidden.set(r + ',' + c, reason);
    }
  }

  function showFlash(msg) {
    flash = msg;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => { flash = null; update(); }, 1600);
    update();
  }

  function place(r, c) {
    if (over || board[r][c] !== EMPTY) return;
    const reason = turn === BLACK && forbidden.get(r + ',' + c);
    if (reason) { showFlash(`✕ 금수 자리예요 (${reason})`); return; }
    flash = null;
    board[r][c] = turn;
    history.push([r, c]);
    const line = findWin(r, c);
    if (line) {
      winLine = line;
      over = true;
      score[turn]++;
    } else if (history.length === N * N) {
      over = true;
    } else {
      turn = turn === BLACK ? WHITE : BLACK;
    }
    update();
  }

  function undo() {
    if (over || !history.length) return;
    const [r, c] = history.pop();
    board[r][c] = EMPTY;
    turn = turn === BLACK ? WHITE : BLACK;
    update();
  }

  // ---------- UI ----------
  let forbiddenKey = '';
  function update() {
    const key = `${history.length}|${turn}|${over}`;
    if (key !== forbiddenKey) { forbiddenKey = key; computeForbidden(); }
    document.getElementById('pBlack').classList.toggle('active', !over && turn === BLACK);
    document.getElementById('pWhite').classList.toggle('active', !over && turn === WHITE);
    document.getElementById('sBlack').textContent = score[BLACK] + '승';
    document.getElementById('sWhite').textContent = score[WHITE] + '승';
    statusEl.classList.toggle('win', over);
    statusEl.classList.toggle('warn', !!flash);
    if (flash) statusEl.textContent = flash;
    else if (winLine) statusEl.textContent = `🎉 ${NAME[turn]} 승리! (${history.length}수)`;
    else if (over) statusEl.textContent = '무승부! 판이 가득 찼어요.';
    else statusEl.textContent = `${NAME[turn]} 차례입니다`;
    undoBtn.disabled = over || history.length === 0;
    canvas.classList.toggle('over', over);
    canvas.classList.toggle('blocked', !!(hover && forbidden.has(hover.join(','))));
    draw();
  }

  function resize() {
    const avail = Math.min(wrap.clientWidth, wrap.clientHeight || wrap.clientWidth, 720);
    size = Math.max(240, Math.floor(avail));
    cell = size / (N + 1);
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = canvas.style.height = size + 'px';
    canvas.width = canvas.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  const pos = i => cell * (i + 1);

  function drawStone(r, c, color, alpha = 1) {
    const x = pos(c), y = pos(r), rad = cell * 0.44;
    ctx.save();
    ctx.globalAlpha = alpha;
    if (alpha === 1) {
      ctx.shadowColor = 'rgba(0,0,0,.35)';
      ctx.shadowBlur = cell * 0.15;
      ctx.shadowOffsetY = cell * 0.06;
    }
    const g = ctx.createRadialGradient(x - rad * .35, y - rad * .35, rad * .1, x, y, rad);
    if (color === BLACK) { g.addColorStop(0, '#666'); g.addColorStop(1, '#0a0a0a'); }
    else { g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#cfcac0'); }
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, rad, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    if (!size || !board) return;
    // 판
    ctx.fillStyle = '#dcb36a';
    ctx.fillRect(0, 0, size, size);
    ctx.strokeStyle = '#5b4220';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < N; i++) {
      ctx.moveTo(pos(0), pos(i)); ctx.lineTo(pos(N - 1), pos(i));
      ctx.moveTo(pos(i), pos(0)); ctx.lineTo(pos(i), pos(N - 1));
    }
    ctx.stroke();
    ctx.fillStyle = '#5b4220';
    for (const r of STARS) for (const c of STARS) {
      ctx.beginPath(); ctx.arc(pos(c), pos(r), Math.max(2, cell * .1), 0, Math.PI * 2); ctx.fill();
    }
    // 돌
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (board[r][c]) drawStone(r, c, board[r][c]);
    // 흑 금수 자리 ✕
    ctx.strokeStyle = 'rgba(229,72,77,.85)';
    ctx.lineWidth = Math.max(1.5, cell * .07);
    ctx.lineCap = 'round';
    const k = cell * .2;
    for (const p of forbidden.keys()) {
      const [r, c] = p.split(',').map(Number);
      ctx.beginPath();
      ctx.moveTo(pos(c) - k, pos(r) - k); ctx.lineTo(pos(c) + k, pos(r) + k);
      ctx.moveTo(pos(c) + k, pos(r) - k); ctx.lineTo(pos(c) - k, pos(r) + k);
      ctx.stroke();
    }
    ctx.lineCap = 'butt';
    // 마우스 미리보기
    if (hover && !over && board[hover[0]][hover[1]] === EMPTY && !forbidden.has(hover.join(','))) {
      drawStone(hover[0], hover[1], turn, .45);
    }
    // 마지막 수 표시
    if (history.length && !winLine) {
      const [r, c] = history[history.length - 1];
      ctx.fillStyle = '#e5484d';
      ctx.beginPath(); ctx.arc(pos(c), pos(r), cell * .1, 0, Math.PI * 2); ctx.fill();
    }
    // 승리 줄
    if (winLine) {
      ctx.strokeStyle = '#e5484d';
      ctx.lineWidth = Math.max(2, cell * .1);
      for (const [r, c] of winLine) {
        ctx.beginPath(); ctx.arc(pos(c), pos(r), cell * .44, 0, Math.PI * 2); ctx.stroke();
      }
    }
  }

  function cellAt(e) {
    const rect = canvas.getBoundingClientRect();
    const c = Math.round((e.clientX - rect.left) / cell - 1);
    const r = Math.round((e.clientY - rect.top) / cell - 1);
    return r >= 0 && r < N && c >= 0 && c < N ? [r, c] : null;
  }

  canvas.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    const h = cellAt(e);
    if (String(h) !== String(hover)) {
      hover = h;
      canvas.classList.toggle('blocked', !!(hover && forbidden.has(hover.join(','))));
      draw();
    }
  });
  canvas.addEventListener('pointerleave', () => { hover = null; draw(); });
  canvas.addEventListener('click', e => { const p = cellAt(e); if (p) place(p[0], p[1]); });
  undoBtn.addEventListener('click', undo);
  document.getElementById('newBtn').addEventListener('click', reset);
  window.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  });
  new ResizeObserver(resize).observe(wrap);

  reset();
  resize();
})();
</script>
</body>
</html>
