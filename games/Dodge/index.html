<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Dodge</title>
<script src="../_shared/theme.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg:#0b0d12; --panel:#141821; --border:#232938; --fg:#e8ecf3; --muted:#8a93a6;
    --accent:#5ad1ff; --danger:#ff5a6e; --hot:#ffb347;
    --grid:rgba(255,255,255,0.035); --overlay:rgba(11,13,18,0.72); --glow:12;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg:#eef1f6; --panel:#ffffff; --border:#d5dae4; --fg:#161b26; --muted:#5b6475;
    --accent:#0a84c6; --danger:#e0334b; --hot:#e07800;
    --grid:rgba(20,30,60,0.06); --overlay:rgba(238,241,246,0.82); --glow:6;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow:hidden; touch-action:none; }
  #wrap { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:16px; }
  #hud { display:flex; justify-content:space-between; width:var(--size); font-size:15px; color:var(--muted); }
  #hud b { color:var(--fg); font-weight:600; }
  canvas { width:var(--size); height:var(--size); background:var(--panel); border:1px solid var(--border); border-radius:6px; display:block; }
  #help { font-size:12px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><span>TIME <b id="time">0.00</b></span><span>BULLETS <b id="count">0</b></span><span>BEST <b id="best">0.00</b></span></div>
  <canvas id="c"></canvas>
  <div id="help">방향키 / WASD 이동 · Space·Enter 시작 · P 일시정지 · 모바일은 화면을 드래그</div>
</div>
<script>
(() => {
  const W = 500, H = 500;                // logical field size
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const $time = document.getElementById('time');
  const $count = document.getElementById('count');
  const $best = document.getElementById('best');

  // ---- theme (CSS 변수에서 캔버스 색을 읽는다) ----
  const C = {};
  function readTheme() {
    for (const k of ['panel', 'fg', 'muted', 'accent', 'danger', 'hot', 'grid', 'overlay', 'glow']) C[k] = GameTheme.css('--' + k);
    C.glow = Number(C.glow) || 0;
  }
  readTheme();
  window.addEventListener('themechange', readTheme);

  // ---- layout / HiDPI ----
  function resize() {
    const size = Math.max(200, Math.min(window.innerWidth - 32, window.innerHeight - 110, 720));
    document.documentElement.style.setProperty('--size', size + 'px');
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- best score ----
  let best = 0;
  try { best = parseFloat(localStorage.getItem('dodge-best')) || 0; } catch (e) {}
  $best.textContent = best.toFixed(2);
  function saveBest() { try { localStorage.setItem('dodge-best', String(best)); } catch (e) {} }

  // ---- state ----
  const player = { x: W/2, y: H/2, r: 5, speed: 190 };
  let bullets = [], particles = [];
  let state = 'ready';   // ready | playing | paused | over
  let elapsed = 0, newRecord = false;

  const keys = {};
  const rand = (a, b) => a + Math.random() * (b - a);

  function targetCount(t) { return Math.min(30 + Math.floor(t * 1.6), 220); }
  function bulletSpeed(t) { return Math.min(110 + t * 1.8, 260); }

  function spawnBullet() {
    let x, y;
    const side = Math.floor(Math.random() * 4), m = 8;
    if (side === 0) { x = rand(0, W); y = -m; }
    else if (side === 1) { x = W + m; y = rand(0, H); }
    else if (side === 2) { x = rand(0, W); y = H + m; }
    else { x = -m; y = rand(0, H); }
    // aim at the player with a little spread
    const ang = Math.atan2(player.y - y, player.x - x) + rand(-0.25, 0.25);
    const sp = bulletSpeed(elapsed) * rand(0.75, 1.15);
    bullets.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, r: 2.6, hue: rand(0, 1) < 0.15 ? 'hot' : 'n' });
  }

  function reset() {
    player.x = W/2; player.y = H/2;
    bullets = []; particles = [];
    elapsed = 0; newRecord = false;
    for (let i = 0; i < targetCount(0); i++) spawnBullet();
    // keep the opening fair: push initial bullets out to the edges only (they already spawn there)
    state = 'playing';
  }

  function die() {
    state = 'over';
    for (let i = 0; i < 40; i++) {
      const a = rand(0, Math.PI * 2), s = rand(40, 220);
      particles.push({ x: player.x, y: player.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: rand(0.4, 1.0), t: 0 });
    }
    if (elapsed > best) { best = elapsed; newRecord = true; saveBest(); $best.textContent = best.toFixed(2); }
  }

  // ---- input ----
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    keys[k] = true;
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
    if ((k === ' ' || k === 'enter') && (state === 'ready' || state === 'over')) reset();
    else if (k === 'p' || k === 'escape') {
      if (state === 'playing') state = 'paused'; else if (state === 'paused') state = 'playing';
    }
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'playing') state = 'paused'; });

  // touch / mouse drag: relative movement
  let drag = null;
  function toField(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  }
  window.addEventListener('pointerdown', e => {
    if (state === 'ready' || state === 'over') { reset(); }
    else if (state === 'paused') state = 'playing';
    const p = toField(e);
    drag = { id: e.pointerId, lx: p.x, ly: p.y };
  });
  window.addEventListener('pointermove', e => {
    if (!drag || drag.id !== e.pointerId || state !== 'playing') return;
    const p = toField(e);
    player.x += (p.x - drag.lx) * 1.2;
    player.y += (p.y - drag.ly) * 1.2;
    drag.lx = p.x; drag.ly = p.y;
    clampPlayer();
  });
  const endDrag = e => { if (drag && drag.id === e.pointerId) drag = null; };
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  function clampPlayer() {
    player.x = Math.max(player.r, Math.min(W - player.r, player.x));
    player.y = Math.max(player.r, Math.min(H - player.r, player.y));
  }

  // ---- update ----
  function update(dt) {
    if (state === 'playing') {
      elapsed += dt;
      let dx = 0, dy = 0;
      if (keys['arrowleft'] || keys['a']) dx -= 1;
      if (keys['arrowright'] || keys['d']) dx += 1;
      if (keys['arrowup'] || keys['w']) dy -= 1;
      if (keys['arrowdown'] || keys['s']) dy += 1;
      if (dx && dy) { dx *= Math.SQRT1_2; dy *= Math.SQRT1_2; }
      player.x += dx * player.speed * dt;
      player.y += dy * player.speed * dt;
      clampPlayer();
    }

    if (state === 'playing' || state === 'over') {
      const m = 20;
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx * dt; b.y += b.vy * dt;
        if (b.x < -m || b.x > W + m || b.y < -m || b.y > H + m) {
          bullets.splice(i, 1);
          continue;
        }
        if (state === 'playing') {
          const ddx = b.x - player.x, ddy = b.y - player.y, rr = b.r + player.r - 1;
          if (ddx*ddx + ddy*ddy < rr*rr) die();
        }
      }
      if (state === 'playing') {
        const need = targetCount(elapsed);
        while (bullets.length < need) spawnBullet();
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96;
        if (p.t > p.life) particles.splice(i, 1);
      }
    }
  }

  // ---- draw ----
  function draw() {
    ctx.fillStyle = C.panel;
    ctx.fillRect(0, 0, W, H);

    // subtle grid
    ctx.strokeStyle = C.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 25; i < W; i += 25) { ctx.moveTo(i, 0); ctx.lineTo(i, H); ctx.moveTo(0, i); ctx.lineTo(W, i); }
    ctx.stroke();

    // bullets
    for (const b of bullets) {
      ctx.fillStyle = b.hue === 'hot' ? C.hot : C.danger;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    }

    // player
    if (state !== 'over') {
      ctx.shadowColor = C.accent; ctx.shadowBlur = C.glow;
      ctx.fillStyle = C.accent;
      ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }

    // particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
      ctx.fillStyle = C.accent;
      ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
    }
    ctx.globalAlpha = 1;

    // overlays
    ctx.textAlign = 'center';
    if (state === 'ready') {
      overlay();
      text('DODGE', W/2, H/2 - 30, 42, C.fg, 'bold');
      text('사방에서 날아오는 총알을 피하세요', W/2, H/2 + 10, 15, C.muted);
      text('Space / Enter / 탭 으로 시작', W/2, H/2 + 44, 15, C.accent);
    } else if (state === 'paused') {
      overlay();
      text('PAUSED', W/2, H/2, 32, C.fg, 'bold');
      text('P 또는 탭으로 계속', W/2, H/2 + 34, 14, C.muted);
    } else if (state === 'over' && particles.length === 0) {
      overlay();
      text('GAME OVER', W/2, H/2 - 40, 36, C.danger, 'bold');
      text(elapsed.toFixed(2) + ' 초 생존', W/2, H/2, 22, C.fg);
      if (newRecord) text('NEW RECORD!', W/2, H/2 + 30, 15, C.hot, 'bold');
      text('Space / Enter / 탭 으로 다시 시작', W/2, H/2 + 64, 14, C.accent);
    }

    $time.textContent = elapsed.toFixed(2);
    $count.textContent = bullets.length;
  }
  function overlay() { ctx.fillStyle = C.overlay; ctx.fillRect(0, 0, W, H); }
  function text(s, x, y, size, color, weight = '') {
    ctx.font = `${weight} ${size}px ui-monospace, Menlo, Consolas, monospace`;
    ctx.fillStyle = color; ctx.fillText(s, x, y);
  }

  // ---- loop ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
